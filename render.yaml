services:
  - type: web
    name: graphql-profile-proxy
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.x
      # IMPORTANT: Update ALLOWED_ORIGINS in Render Dashboard after both services are deployed
      # Go to: Service → Environment → Edit ALLOWED_ORIGINS
      # Set to: https://graphql-profile-proxy.onrender.com,https://your-static-site-name.onrender.com
      # (Replace with your actual service URLs - include both proxy and static site URLs)
      - key: ALLOWED_ORIGINS
        value: https://graphql-profile-proxy.onrender.com
      # Set to production for security features
      - key: NODE_ENV
        value: production
      # Optional: Override default port (defaults to 10000)
      - key: PORT
        value: 10000

